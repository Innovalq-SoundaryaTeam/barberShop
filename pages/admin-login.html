<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | The Barber Studio</title>
    <meta name="description" content="Admin login for The Barber Studio dashboard.">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="../assets/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <style>
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #D4AF37;
            color: #121212;
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .admin-note {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #FFFFFF;
            margin-top: 16px;
        }
        .admin-note code {
            color: #D4AF37;
        }
    </style>
</head>
<body>
    <main class="auth-page">
        <div class="container-fluid">
            <div class="row min-vh-100">
                <!-- Left Side -->
                <div class="col-lg-6 auth-banner d-none d-lg-flex">
                    <div class="auth-overlay">
                        <div class="auth-logo-mark">
                            <i class="fas fa-user-shield" aria-hidden="true"></i>
                        </div>
                        <h1>Admin Portal</h1>
                        <p>Secure access to The Barber Studio management dashboard.</p>
                    </div>
                </div>

                <!-- Right Side -->
                <div class="col-lg-6 d-flex align-items-center">
                    <div class="auth-form-wrapper">
                        <div class="text-center mb-4">
                            <span class="admin-badge">
                                <i class="fas fa-shield-halved"></i> Admin Access
                            </span>
                            <h2>Admin Sign In</h2>
                            <p>Enter your administrator credentials</p>
                        </div>

                        <form class="auth-form" id="adminLoginForm" novalidate>
                            <!-- Admin User ID -->
                            <div class="mb-3">
                                <label class="form-label" for="adminUserId">Admin User ID</label>
                                <input
                                    type="text"
                                    id="adminUserId"
                                    class="form-control"
                                    placeholder="Enter admin user ID"
                                    autocomplete="username"
                                    required>
                            </div>

                            <!-- Admin Password -->
                            <div class="mb-3">
                                <label class="form-label" for="adminPassword">Admin Password</label>
                                <div class="password-wrapper">
                                    <input
                                        type="password"
                                        id="adminPassword"
                                        class="form-control"
                                        placeholder="Enter admin password"
                                        autocomplete="current-password"
                                        required>
                                    <button type="button" class="password-toggle" id="toggleAdminPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Remember -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberAdmin">
                                    <label class="form-check-label" for="rememberAdmin">Keep me signed in</label>
                                </div>
                                <a href="forgot-password.html">Forgot Password?</a>
                            </div>

                            <div id="adminLoginError" class="alert alert-danger d-none" role="alert"></div>

                            <button type="submit" class="btn btn-barber w-100">
                                <i class="fas fa-right-to-bracket me-2"></i> Sign In To Dashboard
                            </button>
                        </form>

                        <div class="admin-note">
                            <i class="fas fa-circle-info me-1"></i>
                            Demo credentials — User ID: <code>admin</code> · Password: <code>admin123</code>
                        </div>

                        <!-- Admin Sign Up Link -->
                        <div class="auth-footer mt-4">
                            <p>
                                Need an admin account?
                                <a href="register.html">Sign Up</a>
                            </p>
                        </div>

                        <!-- Back Home -->
                        <div class="text-center mt-3">
                            <a href="index.html">
                                <i class="fas fa-arrow-left me-1"></i> Back To Website
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        (function () {
            const form = document.getElementById('adminLoginForm');
            const errorBox = document.getElementById('adminLoginError');
            const toggleBtn = document.getElementById('toggleAdminPassword');
            const pwdInput = document.getElementById('adminPassword');

            if (toggleBtn && pwdInput) {
                toggleBtn.addEventListener('click', function () {
                    const isPwd = pwdInput.type === 'password';
                    pwdInput.type = isPwd ? 'text' : 'password';
                    toggleBtn.querySelector('i').className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
                });
            }

            function getAdmins() {
                try {
                    return JSON.parse(localStorage.getItem('bs_admins')) || [];
                } catch (err) {
                    return [];
                }
            }

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    errorBox.classList.add('d-none');
                    const userId = document.getElementById('adminUserId').value.trim();
                    const password = pwdInput.value.trim();

                    // Default admin credentials, always valid (front-end only)
                    const ADMIN_ID = 'admin';
                    const ADMIN_PWD = 'admin123';

                    const isDefaultAdmin = userId === ADMIN_ID && password === ADMIN_PWD;

                    const matchedSignup = getAdmins().find(function (admin) {
                        return admin.userId === userId && admin.password === password;
                    });

                    if (isDefaultAdmin || matchedSignup) {
                        try {
                            sessionStorage.setItem('bs_admin_auth', '1');
                            sessionStorage.setItem('bs_admin_id', userId);
                        } catch (err) {}
                        window.location.href = 'dashboard.html';
                    } else {
                        errorBox.textContent = 'Invalid admin User ID or Password.';
                        errorBox.classList.remove('d-none');
                    }
                });
            }
        })();
    </script>
</body>
</html>
