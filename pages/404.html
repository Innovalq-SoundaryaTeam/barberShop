<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | The Barber Studio</title>

    <meta name="description"
        content="The page you are looking for could not be found. Return to The Barber Studio homepage.">

    <meta name="robots"
        content="noindex, follow">

    <link rel="icon"
        href="../assets/images/favicon.svg">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
        href="../assets/css/style.css">

    <link rel="stylesheet"
        href="../assets/css/dark-mode.css">

</head>

<body>

    <main class="error-page">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8 text-center">

                    <!-- Error Illustration -->

                    <div class="error-illustration">

                        <img
                            src="https://images.pexels.com/photos/17132124/pexels-photo-17132124.jpeg?auto=compress&cs=tinysrgb&w=800"
                            alt="404 Error Illustration"
                            class="img-fluid">

                    </div>

                    <!-- Error Number -->

                    <h1 class="error-code">

                        404

                    </h1>

                    <h2 class="mb-3">

                        Oops! Page Not Found

                    </h2>

                    <p class="error-description">

                        The page you're looking for may have
                        been moved, deleted, or never existed.

                    </p>

                    <!-- Search -->

                    <form
                        class="error-search"
                        action="search.html">

                        <div class="input-group">

                            <input
                                type="search"
                                class="form-control"
                                placeholder="Search the website...">

                            <button
                                class="btn btn-barber"
                                type="submit">

                                <i class="fas fa-search"></i>

                            </button>

                        </div>

                    </form>

                    <!-- CTA Buttons -->

                    <div class="error-actions">

                        <a href="index.html"
                            class="btn btn-barber">

                            <i class="fas fa-home me-2"></i>

                            Back To Home

                        </a>

                        <a href="contact.html"
                            class="btn btn-outline-light">

                            Contact Support

                        </a>

                    </div>

                    <!-- Popular Pages -->

                    <div class="popular-links">

                        <h4>

                            Popular Pages

                        </h4>

                        <ul>

                            <li>
                                <a href="about.html">
                                    About Us
                                </a>
                            </li>

                            <li>
                                <a href="services.html">
                                    Services
                                </a>
                            </li>

                            <li>
                                <a href="pricing.html">
                                    Pricing
                                </a>
                            </li>

                            <li>
                                <a href="gallery.html">
                                    Gallery
                                </a>
                            </li>

                            <li>
                                <a href="contact.html">
                                    Contact
                                </a>
                            </li>

                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
