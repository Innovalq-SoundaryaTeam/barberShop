<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | The Barber Studio</title>

    <meta name="description"
        content="Something amazing is coming soon. Stay tuned for our official launch.">

    <meta name="robots"
        content="noindex,nofollow">

    <link rel="icon"
        href="../assets/images/favicon.svg">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
        href="../assets/css/style.css">

    <link rel="stylesheet"
        href="../assets/css/dark-mode.css">

</head>

<body>

    <main class="coming-soon-page">

        <!-- Background Shapes -->

        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8 text-center">

                    <img
                        src="https://images.pexels.com/photos/17132124/pexels-photo-17132124.jpeg?auto=compress&cs=tinysrgb&w=200"
                        alt="The Barber Studio"
                        class="coming-logo">

                    <h1>

                        We're Launching Soon

                    </h1>

                    <p class="coming-description">

                        Our new premium barber experience is
                        almost ready. Stay connected and be
                        the first to know when we launch.

                    </p>

                    <!-- Countdown -->

                    <div class="countdown-wrapper">

                        <div class="countdown-box">

                            <span id="days">00</span>

                            <small>Days</small>

                        </div>

                        <div class="countdown-box">

                            <span id="hours">00</span>

                            <small>Hours</small>

                        </div>

                        <div class="countdown-box">

                            <span id="minutes">00</span>

                            <small>Minutes</small>

                        </div>

                        <div class="countdown-box">

                            <span id="seconds">00</span>

                            <small>Seconds</small>

                        </div>

                    </div>

                    <!-- Newsletter -->

                    <form class="newsletter-form">

                        <div class="input-group">

                            <input
                                type="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                            <button
                                class="btn btn-barber"
                                type="submit">

                                Notify Me

                            </button>

                        </div>

                    </form>

                    <!-- Social Links -->

                    <div class="coming-social">

                        <a href="#">

                            <i class="fab fa-facebook-f"></i>

                        </a>

                        <a href="#">

                            <i class="fab fa-instagram"></i>

                        </a>

                        <a href="#">

                            <i class="fab fa-x-twitter"></i>

                        </a>

                        <a href="#">

                            <i class="fab fa-youtube"></i>

                        </a>

                    </div>

                    <!-- Contact -->

                    <div class="launch-contact">

                        <p>

                            Questions?

                            <a href="pages/contact.html">

                                Contact Us

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="../assets/js/main.js"></script>

</body>

</html>
