<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | The Barber Studio</title>
    <meta name="description" content="Create your Barber Studio account.">
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" href="../assets/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
</head>
<body>
    <main class="auth-page">
        <div class="container-fluid">
            <div class="row min-vh-100">
                <!-- Left Side -->
                <div class="col-lg-6 auth-banner d-none d-lg-flex">
                    <div class="auth-overlay">
                        <a href="index.html" class="auth-brand-link">
                            <i class="fas fa-scissors" aria-hidden="true"></i> Barber Studio
                        </a>
                        <div class="auth-logo-mark">
                            <i class="fas fa-scissors" aria-hidden="true"></i>
                        </div>
                        <h1>Join Barber Studio</h1>
                        <p>Create an account to book appointments faster and keep track of your visits.</p>
                    </div>
                </div>

                <!-- Right Side -->
                <div class="col-lg-6 d-flex align-items-center">
                    <div class="auth-form-wrapper">
                        <div class="text-center mb-4">
                            <a href="index.html" class="auth-brand-link d-lg-none">
                                <i class="fas fa-scissors" aria-hidden="true"></i> Barber Studio
                            </a>
                            <span class="auth-badge">
                                <i class="fas fa-user-plus"></i> Get Started
                            </span>
                            <h2>Create Account</h2>
                            <p>It only takes a minute</p>
                        </div>

                        <form id="signupForm" class="auth-form" novalidate>
                            <div id="signupError" class="alert alert-danger d-none" role="alert"></div>
                            <div id="signupSuccess" class="alert alert-success d-none" role="alert"></div>

                            <!-- Name -->
                            <div class="mb-3">
                                <label class="form-label" for="signupName">Full Name</label>
                                <input
                                    type="text"
                                    id="signupName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label" for="signupEmail">Email Address</label>
                                <input
                                    type="email"
                                    id="signupEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    autocomplete="username"
                                    required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label" for="signupPassword">Password</label>
                                <div class="password-wrapper">
                                    <input
                                        type="password"
                                        id="signupPassword"
                                        class="form-control"
                                        placeholder="Create a password"
                                        autocomplete="new-password"
                                        required>
                                    <button type="button" class="password-toggle" id="toggleSignupPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Strength -->
                            <div class="mb-3">
                                <div class="password-strength">
                                    <div id="strengthBar"></div>
                                </div>
                                <small id="strengthText">Password Strength</small>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
                                <div class="password-wrapper">
                                    <input
                                        type="password"
                                        id="signupConfirmPassword"
                                        class="form-control"
                                        placeholder="Confirm your password"
                                        autocomplete="new-password"
                                        required>
                                    <button type="button" class="password-toggle" id="toggleConfirmSignupPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-barber w-100">
                                Create Account
                            </button>

                            <div class="auth-divider"><span>or continue with</span></div>

                            <div class="social-login">
                                <button type="button" class="btn btn-outline-barber social-btn-google" id="googleSignupBtn">
                                    <i class="fab fa-google me-2"></i>Google
                                </button>
                                <button type="button" class="btn btn-outline-barber social-btn-apple" id="appleSignupBtn">
                                    <i class="fab fa-apple me-2"></i>Apple
                                </button>
                            </div>

                            <!-- Login Link -->
                            <div class="auth-footer">
                                <p>
                                    Already have an account?
                                    <a href="login.html">Login</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        (function () {
            const form = document.getElementById('signupForm');
            const errorBox = document.getElementById('signupError');
            const successBox = document.getElementById('signupSuccess');
            const pwdInput = document.getElementById('signupPassword');
            const confirmInput = document.getElementById('signupConfirmPassword');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            const googleBtn = document.getElementById('googleSignupBtn');
            const appleBtn = document.getElementById('appleSignupBtn');

            function wireToggle(btnId, input) {
                const btn = document.getElementById(btnId);
                if (!btn || !input) return;
                btn.addEventListener('click', function () {
                    const isPwd = input.type === 'password';
                    input.type = isPwd ? 'text' : 'password';
                    btn.querySelector('i').className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
                });
            }

            wireToggle('toggleSignupPassword', pwdInput);
            wireToggle('toggleConfirmSignupPassword', confirmInput);

            if (pwdInput && strengthBar) {
                pwdInput.addEventListener('input', function () {
                    const val = pwdInput.value;
                    let score = 0;
                    if (val.length >= 8) score++;
                    if (/[A-Z]/.test(val)) score++;
                    if (/[0-9]/.test(val)) score++;
                    if (/[^A-Za-z0-9]/.test(val)) score++;

                    const levels = ['Weak', 'Fair', 'Good', 'Strong'];
                    const colors = ['#e04b4b', '#e0a34b', '#c9d44c', '#4bc97a'];
                    const idx = Math.max(0, score - 1);

                    strengthBar.style.width = val ? ((score / 4) * 100) + '%' : '0%';
                    strengthBar.style.background = val ? colors[idx] : 'transparent';
                    strengthText.textContent = val ? levels[idx] + ' Password' : 'Password Strength';
                });
            }

            function getAccounts() {
                try {
                    return JSON.parse(localStorage.getItem('bs_accounts')) || [];
                } catch (err) {
                    return [];
                }
            }

            function saveAccounts(accounts) {
                try {
                    localStorage.setItem('bs_accounts', JSON.stringify(accounts));
                } catch (err) {}
            }

            function showSocialNotice(provider) {
                errorBox.classList.add('d-none');
                successBox.textContent = provider + ' sign-up isn\'t available in this demo, but the button is wired and ready for a real OAuth integration.';
                successBox.classList.remove('d-none');
            }

            if (googleBtn) {
                googleBtn.addEventListener('click', function () { showSocialNotice('Google'); });
            }
            if (appleBtn) {
                appleBtn.addEventListener('click', function () { showSocialNotice('Apple'); });
            }

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    errorBox.classList.add('d-none');
                    successBox.classList.add('d-none');

                    const name = document.getElementById('signupName').value.trim();
                    const email = document.getElementById('signupEmail').value.trim();
                    const password = pwdInput.value;
                    const confirm = confirmInput.value;
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (!name || !email || !password || !confirm) {
                        errorBox.textContent = 'Please fill in all required fields.';
                        errorBox.classList.remove('d-none');
                        return;
                    }

                    if (!emailPattern.test(email)) {
                        errorBox.textContent = 'Please enter a valid email address.';
                        errorBox.classList.remove('d-none');
                        return;
                    }

                    if (password !== confirm) {
                        errorBox.textContent = 'Passwords do not match.';
                        errorBox.classList.remove('d-none');
                        return;
                    }

                    const accounts = getAccounts();

                    if (accounts.some(function (acc) { return acc.email.toLowerCase() === email.toLowerCase(); })) {
                        errorBox.textContent = 'An account with this email already exists. Please login instead.';
                        errorBox.classList.remove('d-none');
                        return;
                    }

                    accounts.push({
                        name: name,
                        email: email,
                        password: password,
                        createdAt: new Date().toISOString()
                    });

                    saveAccounts(accounts);

                    successBox.textContent = 'Account created! Redirecting to sign in...';
                    successBox.classList.remove('d-none');

                    form.reset();

                    setTimeout(function () {
                        window.location.href = 'login.html';
                    }, 900);
                });
            }
        })();
    </script>
</body>
</html>
