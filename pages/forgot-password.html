<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | The Barber Studio</title>

    <meta name="description"
        content="Reset your Barber Studio account password.">

    <meta name="robots"
        content="noindex,nofollow">

    <link rel="icon"
        href="../assets/images/favicon.svg">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->

    <link rel="stylesheet"
        href="../assets/css/style.css">

    <link rel="stylesheet"
        href="../assets/css/dark-mode.css">

</head>

<body>

    <main class="auth-page">

        <div class="container-fluid">

            <div class="row min-vh-100">

                <!-- Left Side -->

                <div class="col-lg-6 auth-banner d-none d-lg-flex">

                    <div class="auth-overlay">

                        <a href="index.html" class="auth-brand-link">
                            <i class="fas fa-scissors" aria-hidden="true"></i> Barber Studio
                        </a>

                        <div class="auth-logo-mark">
                            <i class="fas fa-scissors"
                                aria-hidden="true"></i>
                        </div>

                        <h1>

                            Forgot Your Password?

                        </h1>

                        <p>

                            No worries. Enter your email and we'll
                            send you a link to reset it.

                        </p>

                    </div>

                </div>

                <!-- Right Side -->

                <div class="col-lg-6 d-flex align-items-center">

                    <div class="auth-form-wrapper">

                        <div class="text-center mb-4">

                            <a href="index.html" class="auth-brand-link d-lg-none">
                                <i class="fas fa-scissors" aria-hidden="true"></i> Barber Studio
                            </a>

                            <h2>

                                Reset Password

                            </h2>

                            <p>

                                Enter the email associated with your account

                            </p>

                        </div>

                        <form
                            id="forgotPasswordForm"
                            class="auth-form"
                            novalidate>

                            <div id="forgotError" class="alert alert-danger d-none" role="alert"></div>
                            <div id="forgotSuccess" class="alert alert-success d-none" role="alert"></div>

                            <!-- Email -->

                            <div class="mb-4">

                                <label
                                    class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    id="forgotEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                            <!-- Submit -->

                            <button
                                type="submit"
                                class="btn btn-barber w-100">

                                Send Reset Link

                            </button>

                        </form>

                        <!-- Back to Login -->

                        <div class="auth-footer">

                            <p>

                                Remembered your password?

                                <a href="login.html">

                                    Login

                                </a>

                            </p>

                        </div>

                        <!-- Back Home -->

                        <div class="text-center mt-4">

                            <a href="index.html">

                                <i class="fas fa-arrow-left me-1"></i> Back To Website

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        (function () {
            const form = document.getElementById('forgotPasswordForm');
            const errorBox = document.getElementById('forgotError');
            const successBox = document.getElementById('forgotSuccess');

            if (!form) return;

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                errorBox.classList.add('d-none');
                successBox.classList.add('d-none');

                const email = document.getElementById('forgotEmail').value.trim();
                const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!pattern.test(email)) {
                    errorBox.textContent = 'Please enter a valid email address.';
                    errorBox.classList.remove('d-none');
                    return;
                }

                successBox.textContent =
                    "If an account exists for " + email + ", a reset link has been sent.";
                successBox.classList.remove('d-none');
                form.reset();
            });
        })();
    </script>

</body>

</html>
